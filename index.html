/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const loginValue =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const selectedRole =
        document.getElementById("role")
        .value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "";

    if(!loginValue || !password){

        message.textContent =
            "กรุณากรอกบัญชีผู้ใช้และรหัสผ่าน";

        return;

    }

    try{

        let email = loginValue;


        /* =================================================
           ถ้ากรอกรหัสนักเรียน
           ให้ค้นหา Email จาก students
        ================================================= */

        if(!loginValue.includes("@")){

            const {
                data,
                error
            } =
            await supabaseClient
                .from("students")
                .select("email")
                .eq(
                    "student_id",
                    loginValue
                )
                .maybeSingle();

            if(error){

                console.error(
                    "ค้นหา Email ไม่สำเร็จ:",
                    error
                );

            }

            if(data && data.email){

                email = data.email;

            }

        }


        /* =================================================
           LOGIN SUPABASE AUTH
        ================================================= */

        const {
            data,
            error
        } =
        await supabaseClient.auth
            .signInWithPassword({

                email: email,

                password: password

            });


        if(error){

            console.error(
                "Login Error:",
                error
            );

            message.textContent =
                "บัญชีผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";

            return;

        }


        if(!data || !data.user){

            message.textContent =
                "ไม่พบข้อมูลบัญชีผู้ใช้";

            return;

        }


        currentUser =
            data.user;


        /* =================================================
           ตรวจสอบ PROFILE
        ================================================= */

        const {
            data: profile,
            error: profileError
        } =
        await supabaseClient
            .from("profiles")
            .select(
                "role, student_id, fullname"
            )
            .eq(
                "id",
                currentUser.id
            )
            .maybeSingle();


        if(profileError){

            console.error(
                "Profile Error:",
                profileError
            );

            message.textContent =
                "ไม่สามารถตรวจสอบสิทธิ์ผู้ใช้ได้";

            await supabaseClient
                .auth
                .signOut();

            currentUser = null;

            return;

        }


        if(!profile){

            message.textContent =
                "ไม่พบข้อมูลสิทธิ์ของบัญชีนี้ใน profiles";

            await supabaseClient
                .auth
                .signOut();

            currentUser = null;

            return;

        }


        /* =================================================
           ROLE จริงจาก profiles
        ================================================= */

        const realRole =
            profile.role;


        /* =================================================
           ตรวจสอบ ROLE
        ================================================= */

        if(
            realRole !== "student" &&
            realRole !== "teacher"
        ){

            message.textContent =
                "บัญชีนี้ไม่มีประเภทผู้ใช้งานที่ถูกต้อง";

            await supabaseClient
                .auth
                .signOut();

            currentUser = null;

            return;

        }


        if(realRole !== selectedRole){

            message.textContent =
                "ประเภทผู้ใช้งานไม่ตรงกับบัญชีนี้";

            await supabaseClient
                .auth
                .signOut();

            currentUser = null;

            return;

        }


        /* =================================================
           บันทึกข้อมูล Login
        ================================================= */

        localStorage.setItem(
            "userRole",
            realRole
        );

        localStorage.setItem(
            "userEmail",
            currentUser.email || email
        );


        if(profile.student_id){

            localStorage.setItem(
                "studentId",
                profile.student_id
            );

        }
        else{

            localStorage.removeItem(
                "studentId"
            );

        }


        /* =================================================
           เปิดระบบ
        ================================================= */

        await openSystem(
            realRole
        );

    }
    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        message.textContent =
            "เกิดข้อผิดพลาดในการเข้าสู่ระบบ";

    }

}

        "studentMenu"

    hideAllSections();


    /* =====================================================
       TEACHER
    ===================================================== */

    if(role === "teacher"){

        document.getElementById(
            "teacherMenu"
        ).style.display = "block";

        document.getElementById(
            "sidebarUser"
        ).textContent =

    /* =====================================================

        document.getElementById(
            sectionId

        section.classList.add(
            "active"
        );

    }


    if(sectionId === "teacherStudents"){

    }


    if(sectionId === "teacherStatus"){

        loadStatusStudents();

    }


    if(sectionId === "teacherReport"){

        setTodayReportDate();

    if(sectionId === "studentGrades"){

}

/* =========================================================
   TEACHER DASHBOARD
========================================================= */

async function loadTeacherDashboard(){

    try{

        const {
            data: students,
            error: studentError
        } =
        await supabaseClient
            .from("students")
            .select("*");


        if(studentError){

            console.error(
                studentError
            );

            return;

        }


        const total =
            students
            ? students.length
            : 0;


        document.getElementById(
            "teacherTotalStudents"
        ).textContent =
            total;


        let present = 0;
        let absent = 0;


        const today =
            getToday();


        const {
            data: attendance,
            error: attendanceError
        } =
        await supabaseClient
            .from("attendance")
            .select("*")
            .eq(
                "date",
                today
            );


        if(attendanceError){

            console.error(
                attendanceError
            );

        }


        (attendance || [])
        .forEach(
            record => {

                if(record.status === "มา"){

                    present++;

                }

                if(record.status === "ขาด"){

                    absent++;

                }

            }
        );


        /* =================================================
           PROBLEM STUDENTS
        ================================================= */

        let problem = 0;


        const {
            data: grades,
            error: gradeError
        } =
        await supabaseClient
            .from("grades")
            .select("*");


        if(gradeError){

            console.error(
                gradeError
            );

        }


        const problemStudents =
            new Set();


        (grades || [])
        .forEach(
            grade => {

                if(
                    [
                        "0",
                        "ร",
                        "มส.",
                        "มผ."
                    ]
                    .includes(
                        String(
                            grade.status
                        )
                    )
                ){

                    problemStudents.add(
                        grade.student_id
                    );

                }

            }
        );


        problem =
            problemStudents.size;


        document.getElementById(
            "teacherPresent"
        ).textContent =
            present;


        document.getElementById(
            "teacherAbsent"
        ).textContent =
            absent;


        document.getElementById(
            "teacherProblem"
        ).textContent =
            problem;


        createTeacherChart(
            present,
            absent,
            problem
        );

    }
    catch(error){

        console.error(
            "Dashboard Error:",
            error
        );

    }

}


/* =========================================================
   TEACHER CHART
========================================================= */

function createTeacherChart(
    present,
    absent,
    problem
){

    const canvas =
        document.getElementById(
            "teacherChart"
        );


    if(!canvas){

        return;

    }


    if(teacherChart){

        teacherChart.destroy();

    }


    teacherChart =
        new Chart(
            canvas,
            {

                type:"bar",

                data:{

                    labels:[
                        "มาเรียน",
                        "ขาดเรียน",
                        "ติด 0/ร/มส./มผ."
                    ],

                    datasets:[{

                        label:"จำนวน",

                        data:[
                            present,
                            absent,
                            problem
                        ]

                    }]

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:true

                }

            }
        );

}


/* =========================================================

async function loadStudents(){

        .order(
            "student_id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(

        alert(
            "โหลดข้อมูลนักเรียนไม่สำเร็จ\n" +

    studentsCache =

    students.forEach(
        (student,index) => {

            `;

        }
    );

}

/* =========================================================
   RENDER STATUS TABLE
========================================================= */

function renderStatusTable(
    students,
    grades
){

    const table =
        document.getElementById(
            "statusTable"
        );


    table.innerHTML = "";


    let number = 0;


    students.forEach(
        student => {

            const studentGrades =
                grades.filter(
                    grade =>
                        String(
                            grade.student_id
                        ) ===
                        String(
                            student.student_id
                        )
                );


            if(
                studentGrades.length === 0
            ){

                number++;


                table.innerHTML +=
                    createStatusRow(
                        student,
                        null,
                        number
                    );

            }
            else{

                studentGrades.forEach(
                    grade => {

                        number++;


                        table.innerHTML +=
                            createStatusRow(
                                student,
                                grade,
                                number
                            );

                    }
                );

            }

        }
    );

}

                <input

                            : ""
                        }
                    >

                    </option>

                        ${
                            status === "ร"
                            ? "selected"

                        }
                    >
                        ร
                    </option>

                    <option value="มส."

                            status === "มส."
                            ? "selected"
                            : ""
                        }
                    >
                        มส.
                    </option>

                    <option value="มผ."

/* =========================================================
   SAVE GRADE
========================================================= */

async function saveGrade(
    studentId,
    gradeId
){

    const subject =
        document.getElementById(
            `subject_${studentId}_${gradeId}`
        )
        .value
        .trim();


    const score =
        document.getElementById(
            `score_${studentId}_${gradeId}`
        )
        .value;


    const status =
        document.getElementById(
            `status_${studentId}_${gradeId}`
        )
        .value;


    if(!subject){

        alert(
            "กรุณากรอกชื่อวิชา"
        );

        return;

    }


    const payload = {

        student_id:
            studentId,

        subject:
            subject,

        score:
            score
            ? Number(score)
            : null,

        status:
            status || null

    };


    let result;


    if(gradeId){

        result =
            await supabaseClient
                .from("grades")
                .update(payload)
                .eq(
                    "id",
                    gradeId
                );

    }
    else{

        result =
            await supabaseClient
                .from("grades")
                .insert([
                    payload
                ]);

    }


    if(result.error){

        console.error(
            result.error
        );

        alert(
            "บันทึกไม่สำเร็จ\n" +
            result.error.message
        );

        return;

    }


    alert(
        "บันทึกผลการเรียนสำเร็จ"
    );


    await loadStatusStudents();

    await loadTeacherDashboard();

}

/* =========================================================

async function loadAttendanceStudents(){

        document.getElementById(
            "attendanceDate"
        ).value;


    if(!date){

        alert(
            "กรุณาเลือกวันที่"

async function saveAttendance(){

    const date =
        document.getElementById(
            "attendanceDate"
        ).value;


    if(!date){

        alert(
            "กรุณาเลือกวันที่"
        );

        return;

    }


    if(
        !attendanceData ||
        attendanceData.length === 0
    ){

        alert(
            "กรุณาโหลดรายชื่อนักเรียนก่อน"
        );

        return;

    }


    for(
        const student
        of attendanceData
    ){

        const status =
            document.getElementById(
                "status_" +
                student.student_id
            ).value;


        const time =
            document.getElementById(
                "time_" +
                student.student_id
            ).value;


        const {
            error
        } =
        await supabaseClient
            .from("attendance")
            .upsert(
                [{

                    student_id:
                        student.student_id,

                    date:
                        date,

                    check_in_time:
                        time || null,

                    status:
                        status

                }],
                {
                    onConflict:
                        "student_id,date"
                }
            );


        if(error){

            console.error(
                error
            );

            alert(
                "บันทึกการเข้าเรียนไม่สำเร็จ\n" +
                error.message
            );

            return;

        }

    }


    alert(
        "✅ บันทึกการเข้าเรียนเรียบร้อยแล้ว"
    );


    await loadTeacherDashboard();

}

/* =========================================================
   FORMAT GRADE STATUS
========================================================= */

function formatGradeStatus(status){

    if(status === "0"){

        return `
            <span class="badge badge-zero">
                ติด 0
            </span>
        `;

    }


    if(status === "ร"){

        return `
            <span class="badge badge-r">
                ติด ร
            </span>
        `;

    }


    if(status === "มส."){

        return `
            <span class="badge badge-ms">
                ติด มส.
            </span>
        `;

    }


    if(status === "มผ."){

        return `
            <span class="badge badge-mp">
                ติด มผ.
            </span>
        `;

    }


    return `
        <span class="badge badge-ok">
            ปกติ
        </span>
    `;

}


/* =========================================================
   FORMAT ATTENDANCE
========================================================= */

function formatAttendanceStatus(
    status
){

    if(status === "มา"){

        return "🟢 มา";

    }


    if(status === "สาย"){

        return "🟡 สาย";

    }


    if(status === "ขาด"){

        return "🔴 ขาด";

    }


    if(status === "ลา"){

        return "🔵 ลา";

    }


    return "⚪ " + status;

}


/* =========================================================
   DATE
========================================================= */

function getToday(){

    const date =
        new Date();


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        )
        .padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        )
        .padStart(
            2,
            "0"
        );


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================================================
   SECURITY HELPERS
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   AUTO LOGIN
========================================================= */

window.addEventListener(
    "load",
    async function(){

        try{

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .getSession();


            if(error){

                console.error(
                    "Session Error:",
                    error
                );

                return;

            }


            if(
                data &&
                data.session &&
                data.session.user
            ){

                currentUser =
                    data.session.user;


                /* =========================================
                   ตรวจสอบ Profile ใหม่ทุกครั้ง
                ========================================= */

                const {
                    data:profile,
                    error:profileError
                } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "role, student_id, fullname"
                    )
                    .eq(
                        "id",
                        currentUser.id
                    )
                    .maybeSingle();


                if(
                    profileError ||
                    !profile
                ){

                    await supabaseClient
                        .auth
                        .signOut();

                    currentUser = null;

                    return;

                }


                const role =
                    profile.role;


                if(
                    role !== "student" &&
                    role !== "teacher"
                ){

                    await supabaseClient
                        .auth
                        .signOut();

                    currentUser = null;

                    return;

                }


                localStorage.setItem(
                    "userRole",
                    role
                );


                localStorage.setItem(
                    "userEmail",
                    currentUser.email || ""
                );


                if(profile.student_id){

                    localStorage.setItem(
                        "studentId",
                        profile.student_id
                    );

                }


                await openSystem(
                    role
                );

            }

        }
        catch(error){

            console.error(
                "AUTO LOGIN ERROR:",
                error
            );

        }

    }
);
